name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Verify solar solver
        run: npm run verify:solver

      # Added: these two gates existed locally but were NOT enforced in CI, so a
      # green CI run did not mean "all green". verify:lunar now also carries the
      # anchor-determinism check.
      - name: Verify rotation logic
        run: npm run verify:rotation

      - name: Verify lunar solver (incl. anchor determinism)
        run: npm run verify:lunar

      - name: Build
        run: npm run build
