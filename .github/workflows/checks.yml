name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Verify solar solver
        run: npm run verify:solver

      - name: Verify rotation logic
        run: npm run verify:rotation

      - name: Verify lunar solver (incl. anchor determinism)
        run: npm run verify:lunar

      - name: Verify server/client solver parity
        run: npm run verify:parity

      - name: Verify generated site data (not stale vs canon)
        run: npm run verify:sitedata

      - name: Verify shell site-agnosticism (incl. Drombeg)
        run: npm run verify:shell

      - name: Verify field screens (true north, no white surfaces, offline, no verification wording)
        run: npm run verify:field

      # Build runs the verify chain again and finishes with the production-bundle
      # gate (no dev slug; no service-worker registration with the flag off).
      - name: Build + production-bundle gate
        run: npm run build
