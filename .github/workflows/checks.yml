name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Verify solar solver
        run: npm run verify:solver
